<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1420"/>
      <stop offset="100%" stop-color="#161E2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- subtle grid lines -->
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#F2EDE1" stroke-opacity="0.06"/>
  <line x1="0" y1="220" x2="1200" y2="220" stroke="#F2EDE1" stroke-opacity="0.06"/>

  <!-- radar circle motif, right side -->
  <g transform="translate(1020,140)" opacity="0.9">
    <circle r="95" fill="none" stroke="#F2EDE1" stroke-opacity="0.12"/>
    <circle r="65" fill="none" stroke="#F2EDE1" stroke-opacity="0.12"/>
    <circle r="35" fill="none" stroke="#F2EDE1" stroke-opacity="0.12"/>
    <path d="M0,0 L0,-95 A95,95 0 0,1 67,-67 Z" fill="#E8A33D" opacity="0.35"/>
    <circle r="4" fill="#E8A33D"/>
  </g>

  <!-- case-file tab accent -->
  <rect x="70" y="70" width="10" height="10" rx="5" fill="#C0392B"/>

  <!-- eyebrow label -->
  <text x="94" y="80" font-family="Courier New, monospace" font-size="14" letter-spacing="3" fill="#E8A33D">FIELD INTELLIGENCE FOR COMPETITIVE STRATEGY</text>

  <!-- main title -->
  <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="1" fill="#FAF8F3">COMPETITOR INTEL</text>

  <!-- tagline -->
  <text x="70" y="188" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#8593A6">Open a case on your market. Get the briefing back.</text>

  <!-- bottom mono strip -->
  <text x="70" y="230" font-family="Courier New, monospace" font-size="12" letter-spacing="2" fill="#5B6B7A">CASE FILE SYSTEM — AI ANALYSIS — REAL-TIME REPORTING</text>
</svg>
